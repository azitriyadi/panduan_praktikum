  <text x="65" y="187" font-size="13" xml:space="preserve"><tspan fill="#cba6f7" font-weight="bold">def</tspan> <tspan fill="#cdd6f4">cek_prima</tspan><tspan fill="#89dceb">(</tspan><tspan fill="#cdd6f4">angka</tspan><tspan fill="#89dceb">)</tspan><tspan fill="#89dceb">:</tspan></text>
