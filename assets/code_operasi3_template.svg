  <text x="695" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f38ba8">✍️ Tugas Mandiri 1 • Modul Fungsi</text>
  <line x1="52" y1="42" x2="52" y2="1092" stroke="#313244" stroke-width="1"/>
  <text x="40" y="77" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">1</text>
  <text x="65" y="77" font-size="13" xml:space="preserve"><tspan fill="#9399b2" font-style="italic"># ==============================================================================</tspan></text>
  <text x="40" y="99" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">2</text>
  <text x="65" y="99" font-size="13" xml:space="preserve"><tspan fill="#9399b2" font-style="italic"># MODUL: operasi3.py</tspan></text>
  <text x="40" y="121" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">3</text>
  <text x="65" y="121" font-size="13" xml:space="preserve"><tspan fill="#9399b2" font-style="italic"># Modul fungsi mandiri (def) dengan nilai kembalian (return)</tspan></text>
  <text x="40" y="143" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">4</text>
  <text x="65" y="143" font-size="13" xml:space="preserve"><tspan fill="#9399b2" font-style="italic"># ==============================================================================</tspan></text>
  <text x="40" y="165" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">5</text>
  <text x="65" y="165" font-size="13" fill="#cdd6f4" xml:space="preserve"></text>
  <text x="40" y="187" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">6</text>
  <text x="65" y="187" font-size="13" xml:space="preserve"><tspan fill="#cba6f7" font-weight="bold">def</tspan> <tspan fill="#cdd6f4">tambah</tspan><tspan fill="#89dceb">(</tspan><tspan fill="#cdd6f4">a</tspan><tspan fill="#89dceb">,</tspan> <tspan fill="#cdd6f4">b</tspan><tspan fill="#89dceb">)</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="209" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">7</text>
  <text x="65" y="209" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">    </tspan><tspan fill="#a6e3a1">&quot;&quot;&quot;Mengembalikan hasil penjumlahan a + b&quot;&quot;&quot;</tspan></text>
  <text x="40" y="231" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">8</text>
  <text x="65" y="231" font-size="13" xml:space="preserve">    <tspan fill="#cba6f7" font-weight="bold">return</tspan> <tspan fill="#cdd6f4">a</tspan> <tspan fill="#89dceb">+</tspan> <tspan fill="#cdd6f4">b</tspan></text>
  <text x="40" y="253" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">9</text>
  <text x="65" y="253" font-size="13" fill="#cdd6f4" xml:space="preserve"></text>
  <text x="40" y="275" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">10</text>
  <text x="65" y="275" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4"></tspan><tspan fill="#cba6f7" font-weight="bold">def</tspan> <tspan fill="#cdd6f4">kurang</tspan><tspan fill="#89dceb">(</tspan><tspan fill="#cdd6f4">a</tspan><tspan fill="#89dceb">,</tspan> <tspan fill="#cdd6f4">b</tspan><tspan fill="#89dceb">)</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="297" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">11</text>
  <text x="65" y="297" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">    </tspan><tspan fill="#a6e3a1">&quot;&quot;&quot;Mengembalikan hasil pengurangan a - b&quot;&quot;&quot;</tspan></text>
  <text x="40" y="319" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">12</text>
  <text x="65" y="319" font-size="13" xml:space="preserve">    <tspan fill="#cba6f7" font-weight="bold">return</tspan> <tspan fill="#cdd6f4">a</tspan> <tspan fill="#89dceb">-</tspan> <tspan fill="#cdd6f4">b</tspan></text>
  <text x="40" y="341" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">13</text>
  <text x="65" y="341" font-size="13" fill="#cdd6f4" xml:space="preserve"></text>
  <text x="40" y="363" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">14</text>
  <text x="65" y="363" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4"></tspan><tspan fill="#cba6f7" font-weight="bold">def</tspan> <tspan fill="#cdd6f4">kali</tspan><tspan fill="#89dceb">(</tspan><tspan fill="#cdd6f4">a</tspan><tspan fill="#89dceb">,</tspan> <tspan fill="#cdd6f4">b</tspan><tspan fill="#89dceb">)</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="385" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">15</text>
  <text x="65" y="385" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">    </tspan><tspan fill="#a6e3a1">&quot;&quot;&quot;Mengembalikan hasil perkalian a * b&quot;&quot;&quot;</tspan></text>
  <text x="40" y="407" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">16</text>
  <text x="65" y="407" font-size="13" xml:space="preserve">    <tspan fill="#cba6f7" font-weight="bold">return</tspan> <tspan fill="#cdd6f4">a</tspan> <tspan fill="#89dceb">*</tspan> <tspan fill="#cdd6f4">b</tspan></text>
  <text x="40" y="429" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">17</text>
  <text x="65" y="429" font-size="13" fill="#cdd6f4" xml:space="preserve"></text>
  <text x="40" y="451" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">18</text>
  <text x="65" y="451" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4"></tspan><tspan fill="#cba6f7" font-weight="bold">def</tspan> <tspan fill="#cdd6f4">bagi</tspan><tspan fill="#89dceb">(</tspan><tspan fill="#cdd6f4">a</tspan><tspan fill="#89dceb">,</tspan> <tspan fill="#cdd6f4">b</tspan><tspan fill="#89dceb">)</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="473" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">19</text>
  <text x="65" y="473" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">    </tspan><tspan fill="#a6e3a1">&quot;&quot;&quot;
    Mengembalikan hasil pembagian a / b.
    Menangani pencegahan error saat pembagi bernilai nol.
    &quot;&quot;&quot;</tspan></text>
  <text x="40" y="495" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">20</text>
  <text x="65" y="495" font-size="13" fill="#cdd6f4" xml:space="preserve">    Mengembalikan hasil pembagian a / b.</text>
  <text x="40" y="517" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">21</text>
  <text x="65" y="517" font-size="13" fill="#cdd6f4" xml:space="preserve">    Menangani pencegahan error saat pembagi bernilai nol.</text>
  <text x="40" y="539" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">22</text>
  <text x="65" y="539" font-size="13" fill="#cdd6f4" xml:space="preserve">    &quot;&quot;&quot;</text>
  <text x="40" y="561" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">23</text>
  <text x="65" y="561" font-size="13" xml:space="preserve">    <tspan fill="#cba6f7" font-weight="bold">if</tspan> <tspan fill="#cdd6f4">b</tspan> <tspan fill="#89dceb">==</tspan> <tspan fill="#fab387">0</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="583" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">24</text>
  <text x="65" y="583" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">        </tspan><tspan fill="#cba6f7" font-weight="bold">return</tspan> <tspan fill="#a6e3a1">&quot;Error: Pembagi tidak boleh bernilai nol!&quot;</tspan></text>
  <text x="40" y="605" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">25</text>
  <text x="65" y="605" font-size="13" xml:space="preserve">    <tspan fill="#cdd6f4"></tspan><tspan fill="#cba6f7" font-weight="bold">return</tspan> <tspan fill="#cdd6f4">a</tspan> <tspan fill="#89dceb">/</tspan> <tspan fill="#cdd6f4">b</tspan></text>
  <text x="40" y="627" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">26</text>
  <text x="65" y="627" font-size="13" fill="#cdd6f4" xml:space="preserve"></text>
  <text x="40" y="649" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">27</text>
  <text x="65" y="649" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4"></tspan><tspan fill="#cba6f7" font-weight="bold">def</tspan> <tspan fill="#cdd6f4">cek_ganjil_genap</tspan><tspan fill="#89dceb">(</tspan><tspan fill="#cdd6f4">angka</tspan><tspan fill="#89dceb">)</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="671" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">28</text>
  <text x="65" y="671" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">    </tspan><tspan fill="#a6e3a1">&quot;&quot;&quot;
    Memeriksa sifat bilangan ganjil atau genap 
    menggunakan operator modulus (%)
    &quot;&quot;&quot;</tspan></text>
  <text x="40" y="693" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">29</text>
  <text x="65" y="693" font-size="13" fill="#cdd6f4" xml:space="preserve">    Memeriksa sifat bilangan ganjil atau genap </text>
  <text x="40" y="715" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">30</text>
  <text x="65" y="715" font-size="13" fill="#cdd6f4" xml:space="preserve">    menggunakan operator modulus (%)</text>
  <text x="40" y="737" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">31</text>
  <text x="65" y="737" font-size="13" fill="#cdd6f4" xml:space="preserve">    &quot;&quot;&quot;</text>
  <text x="40" y="759" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">32</text>
  <text x="65" y="759" font-size="13" xml:space="preserve">    <tspan fill="#cba6f7" font-weight="bold">if</tspan> <tspan fill="#cdd6f4">angka</tspan> <tspan fill="#89dceb">%</tspan> <tspan fill="#fab387">2</tspan> <tspan fill="#89dceb">==</tspan> <tspan fill="#fab387">0</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="781" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">33</text>
  <text x="65" y="781" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">        </tspan><tspan fill="#cba6f7" font-weight="bold">return</tspan> <tspan fill="#a6e3a1">&quot;GENAP&quot;</tspan></text>
  <text x="40" y="803" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">34</text>
  <text x="65" y="803" font-size="13" xml:space="preserve">    <tspan fill="#cdd6f4"></tspan><tspan fill="#cba6f7" font-weight="bold">else</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="825" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">35</text>
  <text x="65" y="825" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">        </tspan><tspan fill="#cba6f7" font-weight="bold">return</tspan> <tspan fill="#a6e3a1">&quot;GANJIL&quot;</tspan></text>
  <text x="40" y="847" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">36</text>
  <text x="65" y="847" font-size="13" fill="#cdd6f4" xml:space="preserve"></text>
  <text x="40" y="869" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">37</text>
  <text x="65" y="869" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4"></tspan><tspan fill="#cdd6f4"></tspan><tspan fill="#cba6f7" font-weight="bold">def</tspan> <tspan fill="#cdd6f4">hitung_deret_aritmatika</tspan><tspan fill="#89dceb">(</tspan><tspan fill="#cdd6f4">awal</tspan><tspan fill="#89dceb">,</tspan> <tspan fill="#cdd6f4">beda</tspan><tspan fill="#89dceb">,</tspan> <tspan fill="#cdd6f4">n</tspan><tspan fill="#89dceb">)</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="891" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">38</text>
  <text x="65" y="891" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">    </tspan><tspan fill="#a6e3a1">&quot;&quot;&quot;
    Menghitung total akumulasi deret menggunakan perulangan for
    &quot;&quot;&quot;</tspan></text>
  <text x="40" y="913" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">39</text>
  <text x="65" y="913" font-size="13" fill="#cdd6f4" xml:space="preserve">    Menghitung total akumulasi deret menggunakan perulangan for</text>
  <text x="40" y="935" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">40</text>
  <text x="65" y="935" font-size="13" fill="#cdd6f4" xml:space="preserve">    &quot;&quot;&quot;</text>
  <text x="40" y="957" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">41</text>
  <text x="65" y="957" font-size="13" xml:space="preserve">    <tspan fill="#cdd6f4">total</tspan> <tspan fill="#89dceb">=</tspan> <tspan fill="#fab387">0</tspan></text>
  <text x="40" y="979" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">42</text>
  <text x="65" y="979" font-size="13" xml:space="preserve">    <tspan fill="#cdd6f4">suku</tspan> <tspan fill="#89dceb">=</tspan> <tspan fill="#cdd6f4">awal</tspan></text>
  <text x="40" y="1001" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">43</text>
  <text x="65" y="1001" font-size="13" xml:space="preserve">    <tspan fill="#cba6f7" font-weight="bold">for</tspan> <tspan fill="#cdd6f4">i</tspan> <tspan fill="#cba6f7" font-weight="bold">in</tspan> <tspan fill="#89b4fa">range</tspan><tspan fill="#89dceb">(</tspan><tspan fill="#cdd6f4">n</tspan><tspan fill="#89dceb">)</tspan><tspan fill="#89dceb">:</tspan></text>
  <text x="40" y="1023" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">44</text>
  <text x="65" y="1023" font-size="13" xml:space="preserve"><tspan fill="#cdd6f4">        </tspan><tspan fill="#cdd6f4">total</tspan> <tspan fill="#89dceb">+=</tspan> <tspan fill="#cdd6f4">suku</tspan></text>
  <text x="40" y="1045" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">45</text>
  <text x="65" y="1045" font-size="13" xml:space="preserve">        <tspan fill="#cdd6f4">suku</tspan> <tspan fill="#89dceb">+=</tspan> <tspan fill="#cdd6f4">beda</tspan></text>
  <text x="40" y="1067" text-anchor="end" font-size="12" fill="#585b70" font-weight="normal">46</text>
  <text x="65" y="1067" font-size="13" xml:space="preserve">    <tspan fill="#cdd6f4"></tspan><tspan fill="#cba6f7" font-weight="bold">return</tspan> <tspan fill="#cdd6f4">total</tspan></text>
