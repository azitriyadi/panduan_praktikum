  <text x="65" y="583" font-size="13" xml:space="preserve">    <tspan fill="#cdd6f4">nilai_maba</tspan> <tspan fill="#89dceb">=</tspan> <tspan fill="#89dceb">[</tspan><tspan fill="#fab387">80</tspan><tspan fill="#89dceb">,</tspan> <tspan fill="#fab387">75</tspan><tspan fill="#89dceb">,</tspan> <tspan fill="#fab387">90</tspan><tspan fill="#89dceb">]</tspan></text>
